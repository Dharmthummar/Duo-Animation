<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#070812" />
    <meta name="description" content="A motion-powered folding image illusion built for Android phones." />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Duo Motion</title>
  </head>
  <body>
    <canvas
      id="scene"
      tabindex="0"
      role="img"
      aria-label="A motion-responsive folding image. Tilt your phone or drag across the screen to move it."
    ></canvas>

    <div class="rotate-notice" id="rotate-notice" aria-hidden="true">
      <span class="rotate-icon" aria-hidden="true">↻</span>
      <p>Rotate back to portrait</p>
    </div>

    <main class="hud" id="hud" aria-label="Duo Motion controls">
      <header class="topbar">
        <div class="brand" aria-label="Duo Motion">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
          <span>Duo Motion</span>
          <small>Android</small>
        </div>
        <button class="icon-button" id="toggle-controls" type="button" aria-label="Hide controls" aria-pressed="false">
          <span aria-hidden="true">⋯</span>
        </button>
      </header>

      <section class="welcome panel" id="welcome" aria-labelledby="welcome-title">
        <p class="eyebrow">MOTION-POWERED ILLUSION</p>
        <h1 id="welcome-title">Tilt your phone.<br />Watch it unfold.</h1>
        <p class="intro">Lay your Android phone face-up, then gently tilt it left or right. You can also swipe to preview the effect.</p>
        <div class="welcome-actions">
          <button class="button primary" id="start-motion" type="button">Enable tilt</button>
          <label class="button secondary file-label">
            Choose a photo
            <input id="file-picker" type="file" accept="image/*" />
          </label>
        </div>
        <button class="text-button" id="manual-preview" type="button">Preview without motion</button>
        <p class="privacy-note">Your photos stay on this device.</p>
      </section>

      <section class="quick-controls panel" id="quick-controls" hidden aria-label="Image controls">
        <label class="compact-button file-label" title="Choose photo">
          <span aria-hidden="true">▧</span><span>Photo</span>
          <input class="quick-picker" type="file" accept="image/*" />
        </label>
        <button class="compact-button" id="recenter" type="button"><span aria-hidden="true">◎</span><span>Center</span></button>
        <button class="compact-button" id="reverse-motion" type="button" aria-pressed="false"><span aria-hidden="true">⇄</span><span>Reverse</span></button>
        <button class="compact-button" id="fullscreen" type="button"><span aria-hidden="true">⛶</span><span>Full</span></button>
        <button class="compact-button install-button" id="install" type="button" hidden><span aria-hidden="true">↓</span><span>Install</span></button>
      </section>
    </main>

    <p class="status" id="status" role="status">Swipe left or right to preview.</p>

    <noscript>
      <p class="noscript">Duo Motion needs JavaScript to respond to your phone's motion.</p>
    </noscript>

    <script src="./app.js"></script>
  </body>
</html>
